services:
  app:
    build:
      context: .
      network: host
    container_name: ooh_manager_app
    ports:
      # Bind to loopback by default. Put a TLS-terminating reverse proxy in
      # front of this; set APP_BIND=0.0.0.0 only if you know it is safe.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-5000}:5000"
    env_file: .env
    environment:
      # Assembled here so credentials live in one place (.env) instead of
      # being duplicated into a connection string by hand.
      MONGODB_URI: mongodb://${MONGO_USER:?set MONGO_USER in .env}:${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}@mongodb:${MONGODB_PORT:-27020}/${MONGO_DB:-ooh_manager_db}?authSource=admin
    volumes:
      - app_data:/app/data
      - app_uploads:/app/app/static/uploads
      - ./secrets:/app/secrets:ro
    depends_on:
      mongodb:
        # Wait for Mongo to actually answer, not merely to have been started.
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: ooh_manager_db
    # No `ports:` mapping. The database is reachable from the app over the
    # compose network and must not be exposed on the host. For local
    # inspection use `docker compose exec mongodb mongosh`, or add a port
    # mapping temporarily.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-ooh_manager_db}
    command: ["--auth", "--port", "${MONGODB_PORT:-27020}"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "${MONGODB_PORT:-27020}", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

volumes:
  mongodb_data:
  app_data:
  app_uploads:
